resources:
  jobs:
    dummy_cicd_smoke_test:
      name: "[${bundle.target}] dummy-cicd-smoke-test"
      max_concurrent_runs: 1
      tags:
        managed_by: databricks-asset-bundle
        pipeline: pfl-cicd-demo
        generated_by: generate_notebook_job.py

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

      tasks:
        - task_key: ingest_smoke_test
          notebook_task:
            notebook_path: ../notebooks/smoke_test.py
            base_parameters:
              environment: ${bundle.target}

        - task_key: transform_smoke_test
          depends_on:
            - task_key: ingest_smoke_test
          notebook_task:
            notebook_path: ../notebooks/smoke_v1.py
            base_parameters:
              environment: ${bundle.target}

        - task_key: validate_smoke_test
          depends_on:
            - task_key: transform_smoke_test
          notebook_task:
            notebook_path: ../notebooks/Hotfix_v1.py
            base_parameters:
              environment: ${bundle.target}

        - task_key: verify_dynamic_pipeline
          depends_on:
            - task_key: validate_smoke_test
          notebook_task:
            notebook_path: ../notebooks/verify_dynamic_pipeline.py
            base_parameters:
              environment: ${bundle.target}

