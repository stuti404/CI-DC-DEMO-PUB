resources:
  jobs:
    dummy_cicd_smoke_test:
      name: "[${bundle.target}] dummy-cicd-smoke-test"
      max_concurrent_runs: 1
      tags:
        managed_by: databricks-asset-bundle
        pipeline: pfl-cicd-demo
        generated_by: generate_notebook_job.py

      # Paused by default - flip pause_status to UNPAUSED once real data/
      # logic replaces the smoke-test notebooks.
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED

      # No job_clusters / new_cluster here on purpose: this workspace's
      # token identity does not have "Allow cluster creation" permission.
      # Omitting a cluster reference lets Databricks fall back to
      # serverless compute, which needs no such permission.
      tasks:
        - task_key: ingest_smoke_test
          notebook_task:
            notebook_path: ../notebooks/smoke_test.py
            base_parameters:
              environment: ${bundle.target}

        - task_key: transform_smoke_test
          depends_on:
            - task_key: ingest_smoke_test
          notebook_task:
            notebook_path: ../notebooks/smoke_v1.py
            base_parameters:
              environment: ${bundle.target}

        - task_key: validate_smoke_test
          depends_on:
            - task_key: transform_smoke_test
          notebook_task:
            notebook_path: ../notebooks/Hotfix_v1.py
            base_parameters:
              environment: ${bundle.target}

