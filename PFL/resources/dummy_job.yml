# Dummy job resource - bundled + deployed by `databricks bundle deploy`.
# Exists purely so buildspec-publish.yml has something real to deploy.

resources:
  jobs:
    dummy_cicd_smoke_test:
      name: "[${bundle.target}] dummy-cicd-smoke-test"
      tasks:
        - task_key: run_smoke_test
          notebook_task:
            notebook_path: ../notebooks/dummy_smoke_test_uat.py
            base_parameters:
              environment: ${bundle.target}
          # Serverless compute - no classic cluster is created, so this
          # doesn't need the "allow cluster create" entitlement.
