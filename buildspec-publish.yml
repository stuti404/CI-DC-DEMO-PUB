# Triggered on push to main/uat/dev under PFL/** (Doc Sec 7 trigger matrix).
# Maps branch -> bundle target: main -> prod, uat -> uat, dev -> dev.
version: 0.2

env:
  secrets-manager:
    DATABRICKS_SP_CLIENT_ID: "databricks/${BUNDLE_TARGET}/sp:DATABRICKS_SP_CLIENT_ID"
    DATABRICKS_SP_CLIENT_SECRET: "databricks/${BUNDLE_TARGET}/sp:DATABRICKS_SP_CLIENT_SECRET"

phases:
  install:
    commands:
      - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
  pre_build:
    commands:
      - |
        case "$CODEBUILD_WEBHOOK_HEAD_REF" in
          refs/heads/main) export BUNDLE_TARGET=prod ;;
          refs/heads/uat)  export BUNDLE_TARGET=uat ;;
          *)                export BUNDLE_TARGET=dev ;;
        esac
      - echo "Publishing dummy bundle to target=$BUNDLE_TARGET"
  build:
    commands:
      - databricks bundle deploy -t $BUNDLE_TARGET

artifacts:
  files:
    - '**/*'
  base-directory: PFL
