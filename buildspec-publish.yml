# Triggered on push to main/uat/dev under PFL/** (Doc Sec 7 trigger matrix).
# Maps branch -> bundle target: main -> prod, uat -> uat, dev -> dev.
version: 0.2

# TEMPORARY: no admin-created service principal exists yet, so this
# authenticates with a personal access token instead. Swap back to
# DATABRICKS_SP_CLIENT_ID/SECRET once an SP is available (Doc Sec 5.1).
env:
  secrets-manager:
    DATABRICKS_TOKEN: "databricks-dummy-token-cicd-demo:DATABRICKS_TOKEN"

phases:
  install:
    commands:
      - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
  pre_build:
    commands:
      - |
        case "$CODEBUILD_WEBHOOK_HEAD_REF" in
          refs/heads/main) export BUNDLE_TARGET=prod ; export DATABRICKS_HOST=$DATABRICKS_HOST_PROD ;;
          refs/heads/uat)  export BUNDLE_TARGET=uat ; export DATABRICKS_HOST=$DATABRICKS_HOST_UAT ;;
          *)                export BUNDLE_TARGET=dev ; export DATABRICKS_HOST=$DATABRICKS_HOST_DEV ;;
        esac
      - echo "Publishing dummy bundle to target=$BUNDLE_TARGET"
  build:
    commands:
      - databricks bundle deploy -t $BUNDLE_TARGET

artifacts:
  files:
    - '**/*'
  base-directory: PFL
