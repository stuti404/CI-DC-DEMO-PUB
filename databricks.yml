# Dummy bundle config - mirrors Doc Sec 3/1 conventions.
# Purpose: prove the CI/CD pipeline (validate -> publish -> execute) end to end.
# Do NOT point this at a real production catalogue/workspace.

bundle:
  name: databricks-test-cicd
  description: "Dummy bundle used to smoke-test the AzDO -> GitHub/CodeBuild migration"

include:
  - PFL/resources/*.yml

# workspace.host is intentionally omitted below - the Databricks CLI does not
# support ${VAR} interpolation for authentication fields. Each target's host
# is supplied via the DATABRICKS_HOST environment variable at deploy time
# (buildspec-publish.yml / buildspec-execute.yml export it per branch from
# DATABRICKS_HOST_DEV / _UAT / _PROD before invoking `databricks bundle`).
#
# run_as/service_principal_name is also omitted for the same reason as the
# personal-token dummy setup: no admin-created service principal exists yet
# (Doc Sec 5.1). Deploys run as the logged-in user instead, under their own
# writable path rather than /Workspace/PFL/.
targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Users/stuti@ganitinc.com/.bundle/${bundle.name}/${bundle.target}

  uat:
    mode: production
    workspace:
      root_path: /Users/stuti@ganitinc.com/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Users/stuti@ganitinc.com/.bundle/${bundle.name}/${bundle.target}
