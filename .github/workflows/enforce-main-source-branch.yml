name: Enforce Main Source Branch

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  pull-requests: write
  contents: read

jobs:
  check-source-branch-main:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source is uat or a hotfix
        run: |
          # Exact-match by design: git ref names cannot contain leading/trailing
          # whitespace, and case differences (e.g. "Uat" vs "uat") are meaningfully
          # different branches that should NOT be treated as equivalent.
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          if [ "$HEAD_REF" = "uat" ]; then
            exit 0
          fi
          case "$HEAD_REF" in
            hotfix|hotfix/*)
              exit 0
              ;;
          esac
          echo "PRs into main must come from uat, or a hotfix/* branch."
          echo "This PR's source branch is '$HEAD_REF'."
          exit 1

      - name: Auto-close on rejection
        if: failure() && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "Closing automatically: PRs into \`main\` must come from \`uat\` or a \`hotfix/*\` branch. This PR's source branch is \`$HEAD_REF\`, which is not allowed. Open a PR into \`uat\` first, then promote \`uat\` into \`main\` separately."
          gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

  check-pfl-execute-single-new-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify hotfix adds exactly one new PFL_EXECUTE file, no name collision on main
        id: check
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          case "$HEAD_REF" in
            hotfix|hotfix/*) ;;
            *)
              echo "Not a hotfix PR - the PFL_EXECUTE single-new-file rule does not apply."
              exit 0
              ;;
          esac

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          ADDED_FILES=$(git diff --name-status --diff-filter=A "$BASE_SHA" "$HEAD_SHA" -- PFL_EXECUTE/ | cut -f2)
          COUNT=$(printf '%s\n' "$ADDED_FILES" | grep -c . || true)

          if [ "$COUNT" -eq 0 ]; then
            echo "reason=count" >> "$GITHUB_OUTPUT"
            echo "Hotfix PRs into main must add exactly one new file under PFL_EXECUTE/. Found 0 new files."
            exit 1
          fi

          if [ "$COUNT" -gt 1 ]; then
            echo "reason=count" >> "$GITHUB_OUTPUT"
            echo "Hotfix PRs into main must add exactly one new file under PFL_EXECUTE/. Found $COUNT:"
            printf '%s\n' "$ADDED_FILES"
            exit 1
          fi

          NEW_FILE=$(printf '%s' "$ADDED_FILES")
          echo "new_file=$NEW_FILE" >> "$GITHUB_OUTPUT"
          echo "Single new file: $NEW_FILE"

          # A hotfix must ONLY add that one new file - it must not also modify,
          # rename, or delete any other file under PFL_EXECUTE/. The earlier
          # ADDED_FILES check only counted additions, so a PR that added one
          # file AND modified another slipped through undetected until this
          # check was added.
          ALL_CHANGED=$(git diff --name-status --diff-filter=ACMRD "$BASE_SHA" "$HEAD_SHA" -- PFL_EXECUTE/ | cut -f2)
          EXTRA_FILES=$(printf '%s\n' "$ALL_CHANGED" | grep -v -F -x "$NEW_FILE" | grep -c . || true)

          if [ "$EXTRA_FILES" -gt 0 ]; then
            echo "reason=extra" >> "$GITHUB_OUTPUT"
            echo "Hotfix PRs into main must ONLY add the one new PFL_EXECUTE/ file - no other files in that folder may be touched. Found extra changes:"
            printf '%s\n' "$ALL_CHANGED" | grep -v -F -x "$NEW_FILE"
            exit 1
          fi

          # Checked against main's CURRENT tip, not this PR's recorded base sha -
          # a second hotfix opened before an earlier one merges would otherwise
          # not see the name collision in its own diff.
          git fetch --no-tags origin main
          if git cat-file -e "origin/main:$NEW_FILE" 2>/dev/null; then
            echo "reason=exists" >> "$GITHUB_OUTPUT"
            echo "$NEW_FILE already exists on main. This already exists."
            exit 1
          fi

          echo "OK: $NEW_FILE is new and does not collide with main."

      - name: Auto-close on rejection
        if: failure() && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_FILE="${{ steps.check.outputs.new_file }}"
          REASON="${{ steps.check.outputs.reason }}"
          if [ "$REASON" = "exists" ]; then
            BODY="Closing automatically: \`$NEW_FILE\` already exists on \`main\`. This already exists - a hotfix must add exactly one *new*, uniquely-named file under \`PFL_EXECUTE/\`. Rename the file, or check whether this hotfix has already been applied."
          elif [ "$REASON" = "extra" ]; then
            BODY="Closing automatically: this hotfix adds a new PFL_EXECUTE/ file but also touches other file(s) in that folder. A hotfix PR into \`main\` may ONLY add its one new file under \`PFL_EXECUTE/\` - no other file in that folder may be modified, renamed, or deleted in the same PR."
          else
            BODY="Closing automatically: a hotfix PR into \`main\` must add exactly one new file under \`PFL_EXECUTE/\` (not zero, not more than one, and not just a modification to an existing file)."
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body "$BODY"
          gh pr close "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"
