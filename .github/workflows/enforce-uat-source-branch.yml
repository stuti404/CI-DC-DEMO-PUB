name: Enforce UAT Source Branch

on:
  pull_request:
    branches: [uat]
    types: [opened, synchronize, reopened, edited]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR source is dev
        run: |
          HEAD_REF="${{ github.event.pull_request.head.ref }}"
          if [ "$HEAD_REF" = "dev" ]; then
            exit 0
          fi
          echo "PRs into uat must come from dev."
          echo "This PR's source branch is '$HEAD_REF'."
          exit 1
