name: notebook-runner-pipeline

on:
  push:
    branches: [dev, uat, main]
    paths:
      - 'PFL/**'
      - 'PFL_EXECUTE/**'
  pull_request:
    branches: [dev, uat, main]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve environment from branch
        id: target
        run: |
          case "${GITHUB_REF##*/}" in
            main) echo "target=prod" >> "$GITHUB_OUTPUT" ;;
            uat)  echo "target=uat"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "target=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Resolve diff range
        id: diff_range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "before=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "after=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "before=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
            echo "after=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate notebook job spec
        env:
          BEFORE_SHA: ${{ steps.diff_range.outputs.before }}
          AFTER_SHA: ${{ steps.diff_range.outputs.after }}
          ENVIRONMENT: ${{ steps.target.outputs.target }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ steps.diff_range.outputs.after }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_notebook_job.py

      - name: Generate hotfix job spec (if any)
        env:
          BEFORE_SHA: ${{ steps.diff_range.outputs.before }}
          AFTER_SHA: ${{ steps.diff_range.outputs.after }}
          ENVIRONMENT: ${{ steps.target.outputs.target }}
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          COMMIT_SHA: ${{ steps.diff_range.outputs.after }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Validate notebook headers and job specs
        run: |
          check_header() {
            local subdir="$1"
            local manifest="$2"
            [ -f "$manifest" ] || return 0
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              FIRST_LINE=$(head -n1 "$subdir/$file")
              if [ "$FIRST_LINE" != "# Databricks notebook source" ]; then
                echo "FAIL: $subdir/$file does not start with '# Databricks notebook source'"
                exit 1
              fi
              python -m py_compile "$subdir/$file"
            done < "$manifest"
          }

          check_header "PFL/notebooks" "PFL/generated/notebook_files.txt"
          check_header "PFL_EXECUTE" "PFL/generated/hotfix_files.txt"

          for spec in PFL/generated/notebook_job.json PFL/generated/hotfix_job.json; do
            [ -f "$spec" ] || continue
            python PFL/scripts/validate_job_spec.py "$spec"
          done

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-dev:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      target: dev
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_DEV }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_DEV }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Generate notebook job spec
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: dev
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_notebook_job.py

      - name: Generate hotfix job spec (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: dev
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Import changed files to workspace
        run: |
          WORKSPACE_ROOT="/Users/stuti@ganitinc.com/pfl-cicd/dev"
          databricks workspace mkdirs "$WORKSPACE_ROOT/notebooks"
          databricks workspace mkdirs "$WORKSPACE_ROOT/PFL_EXECUTE"
          for f in $(cat PFL/generated/notebook_files.txt 2>/dev/null); do
            databricks workspace import "$WORKSPACE_ROOT/notebooks/$f" --file "PFL/notebooks/$f" --language PYTHON --format SOURCE --overwrite
          done
          for f in $(cat PFL/generated/hotfix_files.txt 2>/dev/null); do
            databricks workspace import "$WORKSPACE_ROOT/PFL_EXECUTE/$f" --file "PFL_EXECUTE/$f" --language PYTHON --format SOURCE --overwrite
          done

      - name: Package changed files as build artifact
        run: |
          mkdir -p dist incremental_changes
          git fetch --no-tags --unshallow 2>/dev/null || true
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.before }}" "${{ github.sha }}" \
            -- PFL/ PFL_EXECUTE/ > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              mkdir -p "incremental_changes/$(dirname "$file")"
              cp -- "$file" "incremental_changes/$file"
            fi
          done < changed_files.txt
          if [ -z "$(find incremental_changes -type f)" ]; then
            echo "No PFL/ or PFL_EXECUTE/ changes in this push." > incremental_changes/NO_CHANGES.txt
          fi
          cd incremental_changes
          zip -r "../dist/pfl-changed-files-dev-${{ github.sha }}.zip" .

      - name: Publish artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: pfl-changed-files-dev-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        if: vars.ARTIFACT_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish artifact (S3)
        if: vars.ARTIFACT_S3_BUCKET != ''
        continue-on-error: true
        run: |
          aws s3 cp "dist/pfl-changed-files-dev-${{ github.sha }}.zip" \
            "s3://${{ vars.ARTIFACT_S3_BUCKET }}/pfl/dev/"

  publish-uat:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      target: uat
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_UAT }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_UAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Generate notebook job spec
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: uat
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_notebook_job.py

      - name: Generate hotfix job spec (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: uat
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Import changed files to workspace
        run: |
          WORKSPACE_ROOT="/Users/stuti@ganitinc.com/pfl-cicd/uat"
          databricks workspace mkdirs "$WORKSPACE_ROOT/notebooks"
          databricks workspace mkdirs "$WORKSPACE_ROOT/PFL_EXECUTE"
          for f in $(cat PFL/generated/notebook_files.txt 2>/dev/null); do
            databricks workspace import "$WORKSPACE_ROOT/notebooks/$f" --file "PFL/notebooks/$f" --language PYTHON --format SOURCE --overwrite
          done
          for f in $(cat PFL/generated/hotfix_files.txt 2>/dev/null); do
            databricks workspace import "$WORKSPACE_ROOT/PFL_EXECUTE/$f" --file "PFL_EXECUTE/$f" --language PYTHON --format SOURCE --overwrite
          done

      - name: Package changed files as build artifact
        run: |
          mkdir -p dist incremental_changes
          git fetch --no-tags --unshallow 2>/dev/null || true
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.before }}" "${{ github.sha }}" \
            -- PFL/ PFL_EXECUTE/ > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              mkdir -p "incremental_changes/$(dirname "$file")"
              cp -- "$file" "incremental_changes/$file"
            fi
          done < changed_files.txt
          if [ -z "$(find incremental_changes -type f)" ]; then
            echo "No PFL/ or PFL_EXECUTE/ changes in this push." > incremental_changes/NO_CHANGES.txt
          fi
          cd incremental_changes
          zip -r "../dist/pfl-changed-files-uat-${{ github.sha }}.zip" .

      - name: Publish artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: pfl-changed-files-uat-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        if: vars.ARTIFACT_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish artifact (S3)
        if: vars.ARTIFACT_S3_BUCKET != ''
        continue-on-error: true
        run: |
          aws s3 cp "dist/pfl-changed-files-uat-${{ github.sha }}.zip" \
            "s3://${{ vars.ARTIFACT_S3_BUCKET }}/pfl/uat/"

  publish-prod:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: production
    outputs:
      target: prod
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_PROD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Generate notebook job spec
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: prod
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_notebook_job.py

      - name: Generate hotfix job spec (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: prod
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Import changed files to workspace
        run: |
          WORKSPACE_ROOT="/Users/stuti@ganitinc.com/pfl-cicd/prod"
          databricks workspace mkdirs "$WORKSPACE_ROOT/notebooks"
          databricks workspace mkdirs "$WORKSPACE_ROOT/PFL_EXECUTE"
          for f in $(cat PFL/generated/notebook_files.txt 2>/dev/null); do
            databricks workspace import "$WORKSPACE_ROOT/notebooks/$f" --file "PFL/notebooks/$f" --language PYTHON --format SOURCE --overwrite
          done
          for f in $(cat PFL/generated/hotfix_files.txt 2>/dev/null); do
            databricks workspace import "$WORKSPACE_ROOT/PFL_EXECUTE/$f" --file "PFL_EXECUTE/$f" --language PYTHON --format SOURCE --overwrite
          done

      - name: Package changed files as build artifact
        run: |
          mkdir -p dist incremental_changes
          git fetch --no-tags --unshallow 2>/dev/null || true
          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.before }}" "${{ github.sha }}" \
            -- PFL/ PFL_EXECUTE/ > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              mkdir -p "incremental_changes/$(dirname "$file")"
              cp -- "$file" "incremental_changes/$file"
            fi
          done < changed_files.txt
          if [ -z "$(find incremental_changes -type f)" ]; then
            echo "No PFL/ or PFL_EXECUTE/ changes in this push." > incremental_changes/NO_CHANGES.txt
          fi
          cd incremental_changes
          zip -r "../dist/pfl-changed-files-prod-${{ github.sha }}.zip" .

      - name: Publish artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: pfl-changed-files-prod-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        if: vars.ARTIFACT_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish artifact (S3)
        if: vars.ARTIFACT_S3_BUCKET != ''
        continue-on-error: true
        run: |
          aws s3 cp "dist/pfl-changed-files-prod-${{ github.sha }}.zip" \
            "s3://${{ vars.ARTIFACT_S3_BUCKET }}/pfl/prod/"

  execute:
    needs: [publish-dev, publish-uat, publish-prod]
    if: >
      always() && github.event_name == 'push' &&
      (needs['publish-dev'].result == 'success' ||
       needs['publish-uat'].result == 'success' ||
       needs['publish-prod'].result == 'success')
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      TARGET: ${{ needs['publish-prod'].outputs.target || needs['publish-uat'].outputs.target || needs['publish-dev'].outputs.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Resolve Databricks credentials for target
        id: creds
        run: |
          case "${{ env.TARGET }}" in
            prod) echo "token_env=DATABRICKS_TOKEN_PROD" >> "$GITHUB_OUTPUT"; echo "host_env=DATABRICKS_HOST_PROD" >> "$GITHUB_OUTPUT" ;;
            uat)  echo "token_env=DATABRICKS_TOKEN_UAT"  >> "$GITHUB_OUTPUT"; echo "host_env=DATABRICKS_HOST_UAT"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "token_env=DATABRICKS_TOKEN_DEV"  >> "$GITHUB_OUTPUT"; echo "host_env=DATABRICKS_HOST_DEV"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Generate notebook job spec
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ env.TARGET }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_notebook_job.py

      - name: Generate hotfix job spec (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          ENVIRONMENT: ${{ env.TARGET }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Create and run notebook job (if generated)
        if: hashFiles('PFL/generated/notebook_job.json') != ''
        env:
          DATABRICKS_TOKEN: >-
            ${{ env.TARGET == 'prod' && secrets.DATABRICKS_TOKEN_PROD
             || env.TARGET == 'uat'  && secrets.DATABRICKS_TOKEN_UAT
             || secrets.DATABRICKS_TOKEN_DEV }}
          DATABRICKS_HOST: >-
            ${{ env.TARGET == 'prod' && vars.DATABRICKS_HOST_PROD
             || env.TARGET == 'uat'  && vars.DATABRICKS_HOST_UAT
             || vars.DATABRICKS_HOST_DEV }}
        run: |
          JOB_ID=$(databricks jobs create --json @PFL/generated/notebook_job.json -o json | jq -r .job_id)
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "Failed to create notebook job - no job_id returned."
            exit 1
          fi
          echo "Created notebook job $JOB_ID"
          RUN_ID=$(databricks jobs run-now "$JOB_ID" -o json | jq -r .run_id)
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Failed to trigger run - no run_id returned."
            exit 1
          fi
          echo "Triggered run $RUN_ID"
          ATTEMPTS=0
          MAX_ATTEMPTS=60
          while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
            STATE=$(databricks jobs get-run "$RUN_ID" -o json | jq -r .state.life_cycle_state)
            echo "Run $RUN_ID state: $STATE"
            case "$STATE" in
              TERMINATED|SKIPPED|INTERNAL_ERROR) break ;;
            esac
            ATTEMPTS=$((ATTEMPTS + 1))
            sleep 15
          done
          if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
            echo "Timed out waiting for run $RUN_ID to reach a terminal state."
            exit 1
          fi
          RESULT=$(databricks jobs get-run "$RUN_ID" -o json | jq -r .state.result_state)
          echo "Run $RUN_ID result: $RESULT"
          if [ "$RESULT" != "SUCCESS" ]; then
            echo "Notebook job run did not succeed."
            exit 1
          fi

      - name: Create and run hotfix job (if generated)
        if: hashFiles('PFL/generated/hotfix_job.json') != ''
        env:
          DATABRICKS_TOKEN: >-
            ${{ env.TARGET == 'prod' && secrets.DATABRICKS_TOKEN_PROD
             || env.TARGET == 'uat'  && secrets.DATABRICKS_TOKEN_UAT
             || secrets.DATABRICKS_TOKEN_DEV }}
          DATABRICKS_HOST: >-
            ${{ env.TARGET == 'prod' && vars.DATABRICKS_HOST_PROD
             || env.TARGET == 'uat'  && vars.DATABRICKS_HOST_UAT
             || vars.DATABRICKS_HOST_DEV }}
        run: |
          JOB_ID=$(databricks jobs create --json @PFL/generated/hotfix_job.json -o json | jq -r .job_id)
          if [ -z "$JOB_ID" ] || [ "$JOB_ID" = "null" ]; then
            echo "Failed to create hotfix job - no job_id returned."
            exit 1
          fi
          echo "Created hotfix job $JOB_ID"
          RUN_ID=$(databricks jobs run-now "$JOB_ID" -o json | jq -r .run_id)
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "Failed to trigger run - no run_id returned."
            exit 1
          fi
          echo "Triggered run $RUN_ID"
          ATTEMPTS=0
          MAX_ATTEMPTS=60
          while [ "$ATTEMPTS" -lt "$MAX_ATTEMPTS" ]; do
            STATE=$(databricks jobs get-run "$RUN_ID" -o json | jq -r .state.life_cycle_state)
            echo "Run $RUN_ID state: $STATE"
            case "$STATE" in
              TERMINATED|SKIPPED|INTERNAL_ERROR) break ;;
            esac
            ATTEMPTS=$((ATTEMPTS + 1))
            sleep 15
          done
          if [ "$ATTEMPTS" -ge "$MAX_ATTEMPTS" ]; then
            echo "Timed out waiting for run $RUN_ID to reach a terminal state."
            exit 1
          fi
          RESULT=$(databricks jobs get-run "$RUN_ID" -o json | jq -r .state.result_state)
          echo "Run $RUN_ID result: $RESULT"
          if [ "$RESULT" != "SUCCESS" ]; then
            echo "Hotfix job run did not succeed."
            exit 1
          fi
