name: notebook-runner-pipeline

on:
  push:
    branches: [dev, uat, main]
    paths:
      - 'PFL/**'
      - 'PFL_EXECUTE/**'
  pull_request:
    branches: [dev, uat, main]

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve bundle target from branch
        id: target
        run: |
          case "${GITHUB_REF##*/}" in
            main) echo "target=prod" >> "$GITHUB_OUTPUT" ;;
            uat)  echo "target=uat"  >> "$GITHUB_OUTPUT" ;;
            *)    echo "target=dev"  >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # Regenerates PFL/resources/hotfix_job.yml (untracked) from whichever
      # new file this push added under PFL_EXECUTE/, if any - so validate
      # actually checks the resource that publish-* will deploy, instead of
      # validating a bundle that's silently missing it.
      - name: Generate hotfix job resource (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Validate bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: >-
            ${{ steps.target.outputs.target == 'prod' && vars.DATABRICKS_HOST_PROD
             || steps.target.outputs.target == 'uat'  && vars.DATABRICKS_HOST_UAT
             || vars.DATABRICKS_HOST_DEV }}
        run: databricks bundle validate -t ${{ steps.target.outputs.target }}

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — catch secrets introduced then "fixed" in a later commit on the same PR
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-dev:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      target: dev
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Generate hotfix job resource (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Deploy bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_DEV }}
        run: databricks bundle deploy -t dev

      - name: Package bundle as build artifact
        run: |
          mkdir -p dist incremental_bundle

          git fetch --no-tags --unshallow 2>/dev/null || true

          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.before }}" "${{ github.sha }}" \
            -- PFL/ PFL_EXECUTE/ databricks.yml > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              mkdir -p "incremental_bundle/$(dirname "$file")"
              cp -- "$file" "incremental_bundle/$file"
            fi
          done < changed_files.txt

          if [ -z "$(find incremental_bundle -type f)" ]; then
            echo "No PFL/, PFL_EXECUTE/, or databricks.yml changes in this push." > incremental_bundle/NO_CHANGES.txt
          fi

          cd incremental_bundle

          zip -r "../dist/pfl-bundle-dev-${{ github.sha }}.zip" .

      - name: Publish artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: pfl-bundle-dev-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        if: vars.ARTIFACT_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish artifact (S3)
        if: vars.ARTIFACT_S3_BUCKET != ''
        run: |
          aws s3 cp "dist/pfl-bundle-dev-${{ github.sha }}.zip" \
            "s3://${{ vars.ARTIFACT_S3_BUCKET }}/pfl/dev/"

  publish-uat:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      target: uat
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Generate hotfix job resource (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Deploy bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_UAT }}
        run: databricks bundle deploy -t uat

      - name: Package bundle as build artifact
        run: |
          mkdir -p dist incremental_bundle

          git fetch --no-tags --unshallow 2>/dev/null || true

          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.before }}" "${{ github.sha }}" \
            -- PFL/ PFL_EXECUTE/ databricks.yml > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              mkdir -p "incremental_bundle/$(dirname "$file")"
              cp -- "$file" "incremental_bundle/$file"
            fi
          done < changed_files.txt

          if [ -z "$(find incremental_bundle -type f)" ]; then
            echo "No PFL/, PFL_EXECUTE/, or databricks.yml changes in this push." > incremental_bundle/NO_CHANGES.txt
          fi

          cd incremental_bundle

          zip -r "../dist/pfl-bundle-uat-${{ github.sha }}.zip" .

      - name: Publish artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: pfl-bundle-uat-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        if: vars.ARTIFACT_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish artifact (S3)
        if: vars.ARTIFACT_S3_BUCKET != ''
        run: |
          aws s3 cp "dist/pfl-bundle-uat-${{ github.sha }}.zip" \
            "s3://${{ vars.ARTIFACT_S3_BUCKET }}/pfl/uat/"

  publish-prod:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    environment: production
    outputs:
      target: prod
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Generate hotfix job resource (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Deploy bundle
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST_PROD }}
        run: databricks bundle deploy -t prod

      - name: Package bundle as build artifact
        run: |
          mkdir -p dist incremental_bundle

          git fetch --no-tags --unshallow 2>/dev/null || true

          git diff --name-only --diff-filter=ACMR \
            "${{ github.event.before }}" "${{ github.sha }}" \
            -- PFL/ PFL_EXECUTE/ databricks.yml > changed_files.txt

          echo "Changed files:"
          cat changed_files.txt

          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              mkdir -p "incremental_bundle/$(dirname "$file")"
              cp -- "$file" "incremental_bundle/$file"
            fi
          done < changed_files.txt

          if [ -z "$(find incremental_bundle -type f)" ]; then
            echo "No PFL/, PFL_EXECUTE/, or databricks.yml changes in this push." > incremental_bundle/NO_CHANGES.txt
          fi

          cd incremental_bundle

          zip -r "../dist/pfl-bundle-prod-${{ github.sha }}.zip" .

      - name: Publish artifact (GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: pfl-bundle-prod-${{ github.sha }}
          path: dist/*.zip
          retention-days: 30

      - name: Configure AWS credentials (OIDC)
        if: vars.ARTIFACT_S3_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ARTIFACT_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publish artifact (S3)
        if: vars.ARTIFACT_S3_BUCKET != ''
        run: |
          aws s3 cp "dist/pfl-bundle-prod-${{ github.sha }}.zip" \
            "s3://${{ vars.ARTIFACT_S3_BUCKET }}/pfl/prod/"

  execute:
    needs: [publish-dev, publish-uat, publish-prod]
    if: >
      always() && github.event_name == 'push' &&
      (needs['publish-dev'].result == 'success' ||
       needs['publish-uat'].result == 'success' ||
       needs['publish-prod'].result == 'success')
    runs-on: codebuild-pfl-databricks-runner-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      TARGET: ${{ needs['publish-prod'].outputs.target || needs['publish-uat'].outputs.target || needs['publish-dev'].outputs.target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      # Re-derives the same hotfix_job.yml the deploying publish-* job generated
      # (untracked, so this fresh checkout doesn't have it on disk) - needed so
      # `databricks bundle run hotfix_job` below resolves to the job that was
      # actually deployed, rather than erroring on an unknown job key.
      - name: Generate hotfix job resource (if any)
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: python PFL/scripts/generate_hotfix_resource.py

      - name: Run notebook job on Databricks
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: >-
            ${{ env.TARGET == 'prod' && vars.DATABRICKS_HOST_PROD
             || env.TARGET == 'uat'  && vars.DATABRICKS_HOST_UAT
             || vars.DATABRICKS_HOST_DEV }}
        run: databricks bundle run dummy_cicd_smoke_test -t ${{ env.TARGET }}

      - name: Run hotfix job on Databricks (if generated)
        if: hashFiles('PFL/resources/hotfix_job.yml') != ''
        env:
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_HOST: >-
            ${{ env.TARGET == 'prod' && vars.DATABRICKS_HOST_PROD
             || env.TARGET == 'uat'  && vars.DATABRICKS_HOST_UAT
             || vars.DATABRICKS_HOST_DEV }}
        run: databricks bundle run hotfix_job -t ${{ env.TARGET }}
