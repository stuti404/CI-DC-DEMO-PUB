# Runs on every push/PR, all branches (required GitHub status check, Doc Sec 4/6).
version: 0.2

phases:
  install:
    commands:
      - pip install databricks-cli databricks-sdk
      - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh
  pre_build:
    commands:
      - echo "Validating bundle against target=dev (validate never deploys)"
  build:
    commands:
      - databricks bundle validate -t dev
      - python -m py_compile PFL_EXECUTE/dummy_execute_script.py
      - echo "buildspec-validate passed"
